<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410" font-family="Helvetica, Arial, sans-serif">
<rect width="720" height="410" fill="#ffffff"/>
<line x1="300" y1="40" x2="170" y2="120" stroke="#555" stroke-width="2"/>
<line x1="300" y1="40" x2="430" y2="120" stroke="#555" stroke-width="2"/>
<line x1="430" y1="120" x2="330" y2="200" stroke="#555" stroke-width="2"/>
<line x1="430" y1="120" x2="530" y2="200" stroke="#555" stroke-width="2"/>
<line x1="530" y1="200" x2="450" y2="280" stroke="#555" stroke-width="2"/>
<line x1="530" y1="200" x2="610" y2="280" stroke="#555" stroke-width="2"/>
<line x1="610" y1="280" x2="550" y2="360" stroke="#555" stroke-width="2"/>
<line x1="610" y1="280" x2="670" y2="360" stroke="#555" stroke-width="2"/>
<circle cx="300" cy="40" r="24" fill="#dbe9ff" stroke="#333" stroke-width="2"/>
<text x="300" y="47" text-anchor="middle" font-size="22" fill="#111">=</text>
<circle cx="170" cy="120" r="24" fill="#e6f4e6" stroke="#333" stroke-width="2"/>
<text x="170" y="127" text-anchor="middle" font-size="22" fill="#111">D</text>
<circle cx="430" cy="120" r="24" fill="#dbe9ff" stroke="#333" stroke-width="2"/>
<text x="430" y="127" text-anchor="middle" font-size="22" fill="#111">*</text>
<circle cx="330" cy="200" r="24" fill="#e6f4e6" stroke="#333" stroke-width="2"/>
<text x="330" y="207" text-anchor="middle" font-size="22" fill="#111">B</text>
<circle cx="530" cy="200" r="24" fill="#dbe9ff" stroke="#333" stroke-width="2"/>
<text x="530" y="207" text-anchor="middle" font-size="22" fill="#111">*</text>
<circle cx="450" cy="280" r="24" fill="#e6f4e6" stroke="#333" stroke-width="2"/>
<text x="450" y="287" text-anchor="middle" font-size="22" fill="#111">C</text>
<circle cx="610" cy="280" r="24" fill="#dbe9ff" stroke="#333" stroke-width="2"/>
<text x="610" y="287" text-anchor="middle" font-size="22" fill="#111">+</text>
<circle cx="550" cy="360" r="24" fill="#e6f4e6" stroke="#333" stroke-width="2"/>
<text x="550" y="367" text-anchor="middle" font-size="22" fill="#111">A</text>
<circle cx="670" cy="360" r="24" fill="#e6f4e6" stroke="#333" stroke-width="2"/>
<text x="670" y="367" text-anchor="middle" font-size="22" fill="#111">B</text>
<text x="20" y="395" font-size="14" fill="#333">Tree for D = B * (C * (A + B))   (blue = operator, green = identifier)</text>
</svg>